<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <meta name="theme-color" content="#161410">
  <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "{{ site.url }}/#person",
        "name": "Gerob",
        "url": "{{ site.url }}",
        "image": "{{ site.logo }}",
        "jobTitle": "Coding Enthusiast",
        "description": "Available to hire for web and mobile apps. Freelance, contract, or full-time.",
        "sameAs": [
          "https://github.com/gerob",
          "https://www.linkedin.com/in/gerobkimball/"
        ],
        "knowsAbout": [
          "Artifical Intelligence",
          "LLMs",
          "AI Prompts",
          "Web applications",
          "Mobile apps",
          "APIs",
          "PHP",
          "Node.js",
          "Python",
          "JavaScript",
          "HTML",
          "CSS",
          "Sass",
          "Payments",
          "Analytics",
          "Testing"
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <div class="page">
    {{ content }}
  </div>
</body>
</html>
