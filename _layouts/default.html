<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <meta name="theme-color" content="#161410">
  <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "{{ site.url }}/#person",
        "name": "gerob",
        "alternateName": "Jollygg",
        "url": "{{ site.url }}",
        "image": "{{ site.logo }}",
        "jobTitle": "Full-stack developer",
        "sameAs": [
          "https://github.com/gerob",
          "https://github.com/sponsors/gerob"
        ],
        "knowsAbout": [
          "LootCollector",
          "AdiBags-Ascension",
          "Project Ascension",
          "World of Warcraft",
          "Lua",
          "APIs",
          "PHP",
          "Laravel",
          "Node.js",
          "Python"
        ]
      },
      {
        "@type": ["SoftwareApplication", "SoftwareSourceCode"],
        "name": "LootCollector",
        "alternateName": "LootCollector for Project Ascension",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Windows",
        "programmingLanguage": "Lua",
        "description": "World of Warcraft addon for Project Ascension. Find and track Worldforged items, chest spawns, special vendors, and Mystic Scrolls.",
        "url": "https://github.com/gerob/LootCollector",
        "codeRepository": "https://github.com/gerob/LootCollector",
        "downloadUrl": "https://github.com/gerob/LootCollector/releases",
        "author": { "@id": "{{ site.url }}/#person" }
      },
      {
        "@type": ["SoftwareApplication", "SoftwareSourceCode"],
        "name": "AdiBags-Ascension",
        "alternateName": "AdiBags for Project Ascension",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Windows",
        "programmingLanguage": "Lua",
        "description": "Bag addon for the Project Ascension 3.3.5 World of Warcraft client. Fork of AdiBags with Ascension bank, keyring, junk, and merchant support.",
        "url": "https://github.com/gerob/AdiBags-Ascension",
        "codeRepository": "https://github.com/gerob/AdiBags-Ascension",
        "downloadUrl": "https://github.com/gerob/AdiBags-Ascension/releases",
        "author": { "@id": "{{ site.url }}/#person" }
      }
    ]
  }
  </script>
</head>
<body>
  <div class="page">
    {{ content }}
  </div>
</body>
</html>
